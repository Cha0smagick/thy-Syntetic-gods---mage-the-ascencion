<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" fill="#000000"/>
  
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#003300" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="url(#grid)"/>
  
  <!-- Scanlines -->
  <defs>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="url(#scanlines)"/>
  
  <!-- Border -->
  <rect x="16" y="16" width="480" height="480" fill="none" stroke="#FF00FF" stroke-width="4"/>
  <rect x="20" y="20" width="472" height="472" fill="none" stroke="#FF00FF" stroke-width="1" stroke-dasharray="8,4"/>
  
  <!-- Faction badge -->
  <text x="256" y="80" font-family="monospace" font-size="14" fill="#FF00FF" text-anchor="middle" letter-spacing="2">VIRTUAL ADEPTS</text>
  
  <!-- Symbols -->
  <g font-family="sans-serif" font-size="48" fill="#FF00FF" text-anchor="middle">
    <text x="176" y="200">🛹</text><text x="256" y="200">💻</text><text x="336" y="200">☠</text>
  </g>
  
  <!-- Name -->
  <text x="256" y="280" font-family="monospace" font-size="24" fill="#FF00FF" text-anchor="middle" letter-spacing="1">ZERO COOL</text>
  
  <!-- Divider -->
  <line x1="156" y1="300" x2="356" y2="300" stroke="#FF00FF" stroke-width="2"/>
  
  <!-- Placeholder text -->
  <text x="256" y="340" font-family="monospace" font-size="12" fill="#00FF00" text-anchor="middle" opacity="0.7">[IMAGE GENERATION</text>
  <text x="256" y="360" font-family="monospace" font-size="12" fill="#00FF00" text-anchor="middle" opacity="0.7">CONTENT FILTERED]</text>
  <text x="256" y="390" font-family="monospace" font-size="10" fill="#00FF00" text-anchor="middle" opacity="0.5">PLACEHOLDER - REPLACE WITH AI GENERATED</text>
  
  <!-- Corner brackets -->
  <g stroke="#FF00FF" stroke-width="3" fill="none">
    <path d="M 40 40 L 40 80 M 40 40 L 80 40"/> <!-- TL -->
    <path d="M 472 40 L 472 80 M 472 40 L 432 40"/> <!-- TR -->
    <path d="M 40 472 L 40 432 M 40 472 L 80 472"/> <!-- BL -->
    <path d="M 472 472 L 472 432 M 472 472 L 432 472"/> <!-- BR -->
  </g>
  
  <!-- Geocities footer -->
  <text x="256" y="490" font-family="monospace" font-size="10" fill="#00FF00" text-anchor="middle" opacity="0.5">THE SYNTHETIC GODS • 1999</text>
</svg>